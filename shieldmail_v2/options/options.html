<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<title>ShieldMail — Configuration</title>
<style>
:root{--bg:#070B11;--bg2:#0D1520;--bg3:#111D2E;--b:#1E3048;
  --teal:#00D4B4;--ham:#00D4B4;--spam:#FF5B3A;--phish:#F5A623;
  --w:#F0F4F8;--g:#5C7A96;--gl:#8AAFC8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;background:var(--bg);color:var(--w);
  font-family:'DM Sans',-apple-system,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.card{width:100%;max-width:480px;background:var(--bg2);border:1px solid var(--b);
  border-radius:14px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.5);}
.hdr{background:var(--bg3);border-bottom:1px solid var(--b);padding:22px 28px;
  display:flex;align-items:center;gap:10px;}
.dot{width:8px;height:8px;background:var(--teal);border-radius:50%;
  box-shadow:0 0 8px var(--teal);animation:p 2s infinite;flex-shrink:0;}
@keyframes p{0%,100%{opacity:1}50%{opacity:.5}}
.logo{font-weight:800;font-size:18px;flex:1;}
.ver{font-family:monospace;font-size:10px;color:var(--g);}
.intro{padding:20px 28px 4px;font-size:13px;color:var(--gl);line-height:1.6;}
.intro b{color:var(--w);}
.sec{padding:18px 28px;border-bottom:1px solid var(--b);}
.sec:last-of-type{border-bottom:none;}
.lbl{font-size:12px;color:var(--gl);margin-bottom:6px;display:block;}
.lbl small{display:block;font-size:10.5px;color:var(--g);margin-top:2px;font-weight:400;}
.inp{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:6px;
  color:var(--w);font-family:monospace;font-size:12px;padding:9px 10px;outline:none;
  transition:border-color .2s;}
.inp:focus{border-color:var(--teal);}
.inp::placeholder{color:#3E5670;}
.opt-tag{display:inline-block;font-size:9px;font-family:monospace;color:var(--g);
  border:1px solid var(--b);border-radius:3px;padding:1px 5px;margin-left:6px;
  text-transform:uppercase;letter-spacing:.05em;}
.foot{padding:20px 28px;display:flex;flex-direction:column;gap:10px;}
.btn{width:100%;padding:12px;border-radius:7px;border:none;font-size:13px;font-weight:700;
  cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .15s;}
.btn:hover{opacity:.9;}
.btn:disabled{opacity:.5;cursor:default;}
.btn-primary{background:var(--teal);color:#04120F;}
.btn-ghost{background:transparent;color:var(--g);border:1px solid var(--b);}
.note{font-size:10.5px;color:var(--g);text-align:center;line-height:1.5;}
.status{display:none;font-size:12px;text-align:center;padding:10px;border-radius:6px;
  margin:0 28px 18px;font-weight:600;}
.status.show{display:block;}
.status.ok{background:rgba(0,212,180,.12);color:var(--teal);border:1px solid rgba(0,212,180,.3);}
</style>
</head>
<body>

<div class="card">
  <div class="hdr">
    <div class="dot"></div>
    <div class="logo">ShieldMail</div>
    <div class="ver">Configuration</div>
  </div>

  <div class="intro">
    Renseignez ces informations <b>une seule fois</b>. Elles seront conservées
    localement et l'interface principale ne les redemandera plus.
  </div>

  <div class="sec">
    <label class="lbl" for="apiUrl">API locale (pipeline IA)
      <small>Adresse du serveur d'analyse ShieldMail sur votre machine</small>
    </label>
    <input class="inp" id="apiUrl" placeholder="http://localhost:8000"/>
  </div>

  <div class="sec">
    <label class="lbl" for="abuseipdbKey">Clé AbuseIPDB <span class="opt-tag">optionnel</span>
      <small>Utilisée pour vérifier la réputation des adresses IP</small>
    </label>
    <input class="inp" id="abuseipdbKey" type="password" placeholder="Votre clé AbuseIPDB"/>
  </div>

  <div class="sec">
    <label class="lbl" for="virustotalKey">Clé VirusTotal <span class="opt-tag">optionnel</span>
      <small>Utilisée pour vérifier la réputation des noms de domaine</small>
    </label>
    <input class="inp" id="virustotalKey" type="password" placeholder="Votre clé VirusTotal"/>
  </div>

  <div class="status" id="status">✓ Configuration enregistrée</div>

  <div class="foot">
    <button class="btn btn-primary" id="save-btn">Enregistrer la configuration</button>
    <button class="btn btn-ghost" id="close-btn" style="display:none">Fermer cet onglet</button>
    <div class="note" id="note">Vous pourrez modifier ces réglages plus tard depuis cette même page.</div>
  </div>
</div>

<script src="options.js"></script>
</body>
</html>
