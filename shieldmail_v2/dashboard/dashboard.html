<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<title>ShieldMail — Dashboard</title>
<link rel="stylesheet" href="../common/theme-picker.css"/>
<style>
:root{--sm-bg:#070B11;--sm-bg2:#0D1520;--sm-bg3:#111D2E;--sm-border:#1E3048;
  --sm-accent:#00D4B4;--sm-accent-rgb:0,212,180;
  --sm-ham:#00D4B4;--sm-ham-rgb:0,212,180;--sm-spam:#FF5B3A;--sm-spam-rgb:255,91,58;
  --sm-phish:#F5A623;--sm-phish-rgb:245,166,35;
  --sm-text:#F0F4F8;--sm-text-dim:#5C7A96;--sm-text-mid:#8AAFC8;
  --sm-font-main:'DM Sans',-apple-system,sans-serif;--sm-font-mono:monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--sm-bg);color:var(--sm-text);font-family:var(--sm-font-main);
  min-height:100vh;padding:28px clamp(16px,4vw,48px) 60px;}

.top{display:flex;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap;}
.top .dot{width:9px;height:9px;background:var(--sm-accent);border-radius:50%;box-shadow:0 0 10px var(--sm-accent);animation:p 2s infinite;}
@keyframes p{0%,100%{opacity:1}50%{opacity:.5}}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.01em;}
.top .sub{font-family:var(--sm-font-mono);font-size:10.5px;color:var(--sm-text-dim);}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
.icon-btn{background:var(--sm-bg2);border:1px solid var(--sm-border);color:var(--sm-text-mid);
  font-family:var(--sm-font-mono);font-size:10.5px;padding:8px 12px;border-radius:8px;cursor:pointer;}
.icon-btn:hover{border-color:var(--sm-accent);color:var(--sm-text);}

#theme-pop{position:relative;}
#theme-panel{display:none;position:absolute;right:0;top:calc(100% + 8px);width:280px;background:var(--sm-bg2);
  border:1px solid var(--sm-border);border-radius:10px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:50;}
#theme-panel.show{display:block;}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px;}
.kpi{background:var(--sm-bg2);border:1px solid var(--sm-border);border-radius:12px;padding:16px;}
.kpi .v{font-size:26px;font-weight:800;line-height:1;margin-bottom:6px;}
.kpi .l{font-family:var(--sm-font-mono);font-size:9.5px;color:var(--sm-text-dim);text-transform:uppercase;letter-spacing:.06em;}
.kpi.ham .v{color:var(--sm-ham);} .kpi.spam .v{color:var(--sm-spam);} .kpi.phish .v{color:var(--sm-phish);}
.kpi.accent .v{color:var(--sm-accent);}

/* Grid layout */
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:820px){.grid{grid-template-columns:1fr;}}
.panel{background:var(--sm-bg2);border:1px solid var(--sm-border);border-radius:14px;padding:18px 20px;}
.panel h2{font-size:12.5px;font-family:var(--sm-font-mono);text-transform:uppercase;letter-spacing:.08em;
  color:var(--sm-text-mid);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.panel h2 small{margin-left:auto;color:var(--sm-text-dim);text-transform:none;letter-spacing:0;font-weight:400;}

/* Donut */
.donut-wrap{display:flex;align-items:center;gap:20px;}
.donut-legend{display:flex;flex-direction:column;gap:8px;font-size:12px;}
.donut-legend .li{display:flex;align-items:center;gap:8px;}
.donut-legend i{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.donut-legend b{margin-left:auto;font-family:var(--sm-font-mono);}

/* Bars (layers) */
.layer-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.layer-row:last-child{margin-bottom:0;}
.layer-name{width:150px;flex-shrink:0;font-size:11.5px;color:var(--sm-text-mid);}
.layer-track{flex:1;height:8px;background:var(--sm-bg3);border-radius:4px;overflow:hidden;}
.layer-fill{height:100%;border-radius:4px;transition:width .6s ease;}
.layer-val{width:34px;text-align:right;font-family:var(--sm-font-mono);font-size:11px;color:var(--sm-text-dim);}

/* Table */
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{text-align:left;font-family:var(--sm-font-mono);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.05em;color:var(--sm-text-dim);padding:6px 8px;border-bottom:1px solid var(--sm-border);}
tbody td{padding:8px;border-bottom:1px solid rgba(var(--sm-accent-rgb),.06);color:var(--sm-text-mid);vertical-align:middle;}
tbody tr:hover{background:rgba(var(--sm-accent-rgb),.04);}
.pill{font-family:var(--sm-font-mono);font-size:9.5px;padding:2px 7px;border-radius:20px;text-transform:uppercase;}
.pill.ham{background:rgba(var(--sm-ham-rgb),.15);color:var(--sm-ham);}
.pill.spam{background:rgba(var(--sm-spam-rgb),.15);color:var(--sm-spam);}
.pill.phishing{background:rgba(var(--sm-phish-rgb),.15);color:var(--sm-phish);}
.corr-tag{font-family:var(--sm-font-mono);font-size:9.5px;color:var(--sm-accent);}
.src-tag{font-family:var(--sm-font-mono);font-size:9px;color:var(--sm-text-dim);}
.empty-state{padding:40px 20px;text-align:center;color:var(--sm-text-dim);font-size:13px;line-height:1.7;}

.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.filters button{background:var(--sm-bg3);border:1px solid var(--sm-border);color:var(--sm-text-dim);
  font-family:var(--sm-font-mono);font-size:9.5px;padding:5px 10px;border-radius:6px;cursor:pointer;text-transform:uppercase;}
.filters button.active{border-color:var(--sm-accent);color:var(--sm-accent);background:rgba(var(--sm-accent-rgb),.08);}

.reset-btn{margin-top:18px;background:none;border:1px dashed var(--sm-border);color:var(--sm-text-dim);
  font-family:var(--sm-font-mono);font-size:10px;padding:8px 12px;border-radius:8px;cursor:pointer;}
.reset-btn:hover{border-color:var(--sm-spam);color:var(--sm-spam);}
</style>
</head>
<body>

<div class="top">
  <div class="dot"></div>
  <div>
    <h1>ShieldMail — Dashboard</h1>
    <div class="sub">Récapitulatif des scans, corrections & superposition des couches — ENSPY 5GI</div>
  </div>
  <div class="top-actions">
    <div id="theme-pop">
      <button class="icon-btn" id="theme-toggle-btn">🎨 Thème</button>
      <div id="theme-panel">
        <div id="theme-picker"></div>
      </div>
    </div>
    <button class="icon-btn" id="refresh-btn">↻ Actualiser</button>
  </div>
</div>

<div class="kpis" id="kpis"></div>

<div class="grid">
  <div class="panel">
    <h2>// Volume de scans <small id="volume-range">14 derniers jours</small></h2>
    <div id="volume-chart"></div>
  </div>
  <div class="panel">
    <h2>// Répartition des verdicts</h2>
    <div class="donut-wrap">
      <div id="donut-chart"></div>
      <div class="donut-legend" id="donut-legend"></div>
    </div>
  </div>
</div>

<div class="grid">
  <div class="panel">
    <h2>// Contribution moyenne des couches <small>score de fusion</small></h2>
    <div id="layers-chart"></div>
  </div>
  <div class="panel">
    <h2>// Score de menace fusionné <small>tendance</small></h2>
    <div id="score-chart"></div>
  </div>
</div>

<div class="panel">
  <h2>// Historique des scans</h2>
  <div class="filters" id="filters">
    <button data-f="all" class="active">Tous</button>
    <button data-f="ham">Ham</button>
    <button data-f="spam">Spam</button>
    <button data-f="phishing">Phishing</button>
    <button data-f="corrected">Corrigés</button>
  </div>
  <div id="table-wrap"></div>
</div>

<button class="reset-btn" id="reset-btn">Réinitialiser l'historique local</button>

<script src="../common/theme.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
